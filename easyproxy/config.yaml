name: "EasyProxy"
version: "2.0.0"
slug: easyproxy
description: "Proxy HLS/M3U8/DASH, estrattori e DVR"
url: "https://github.com/realbestia1/EasyProxy"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ports:
  7860/tcp: 7860
ports_description:
  7860/tcp: "Web UI, proxy e API"
webui: "http://[HOST]:[7860]/admin"
watchdog: "tcp://[HOST]:[7860]"
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
options:
  api_password: "cambiami"
  warp_license_key: ""
schema:
  api_password: password
  warp_license_key: str?
