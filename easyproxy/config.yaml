name: "EasyProxy Full"
description: "Proxy universale HLS/M3U8/IPTV con FlareSolverr v3 e Byparr. Compatibile con Stremio/MediaFlow Proxy."
version: "2.1.0"
slug: "easyproxy"
init: false

arch:
  - aarch64
  - amd64

ports:
  7860/tcp: 7860
ports_description:
  7860/tcp: "Web Interface & API"

options:
  api_password: "cambiami"
  port: 7860
  mpd_mode: "legacy"
  log_level: "WARNING"
  dvr_enabled: false
  global_proxy: ""
  transport_routes: ""
  workers: 0

schema:
  api_password: str
  port: int
  mpd_mode: list(ffmpeg|legacy|none)
  log_level: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
  dvr_enabled: bool
  global_proxy: str
  transport_routes: str
  workers: int

map:
  - share:rw

ingress: true
ingress_port: 7860
panel_icon: "mdi:television-play"
panel_title: "EasyProxy Full"
