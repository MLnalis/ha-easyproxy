name: "EasyProxy Full"
description: "Proxy universale HLS/M3U8/IPTV con FlareSolverr v3 e Byparr. Drop-in per Stremio / MediaFlow Proxy."
version: "2.1.3"
slug: "easyproxy"
url: "https://github.com/MLnalis/ha-easyproxy"
init: false

arch:
  - amd64

startup: application
boot: auto

ports:
  7860/tcp: 7860
ports_description:
  7860/tcp: "EasyProxy — Web Interface & API"

# Equivalente alle variabili environment del docker-compose originale:
#   API_PASSWORD, PORT, MPD_MODE, GLOBAL_PROXY, TRANSPORT_ROUTES
options:
  api_password: "cambiami"
  port: 7860
  mpd_mode: "legacy"
  log_level: "WARNING"
  dvr_enabled: false
  global_proxy: ""
  transport_routes: ""
  workers: 0

schema:
  api_password: password
  port: port
  mpd_mode: list(ffmpeg|legacy|none)
  log_level: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
  dvr_enabled: bool
  global_proxy: "str?"
  transport_routes: "str?"
  workers: "int(0,32)"

# Equivalente a: volumes: - /share/easyproxy:/share/easyproxy
map:
  - type: share
    read_only: false

ingress: true
ingress_port: 7860
ingress_stream: true
panel_icon: "mdi:television-play"
panel_title: "EasyProxy"

# HA riavvia automaticamente se /api/info non risponde
watchdog: "http://[HOST]:[PORT:7860]/api/info"

backup: hot
backup_exclude:
  - /share/easyproxy/recordings