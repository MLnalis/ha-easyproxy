name: "EasyProxy (FULL, no WARP)"
description: >
  MediaFlow Proxy per Stremio — versione FULL senza WARP.
  Proxy streaming per add-on Stremio italiani (Streamvix, ecc.)
version: "1.0.0"
slug: "easyproxy"
url: "https://github.com/realbestia1/EasyProxy"
arch:
  - amd64
  - aarch64
  - armv7
init: false
ports:
  7860/tcp: 7860
ports_description:
  7860/tcp: "EasyProxy Web / API"
options:
  api_password: "cambia_questa_password"
  worker_class: "uvicorn.workers.UvicornWorker"
  workers: 1
schema:
  api_password: str
  worker_class: str
  workers: int
map:
  - config:rw
image: "ghcr.io/home-assistant/{arch}-addon-easyproxy"
