name: "EasyProxy (FULL, no WARP)"
description: >
  EasyProxy versione FULL senza WARP per Stremio.
  Include FlareSolverr v3 e Byparr integrati.
version: "1.0.3"
slug: "easyproxy"
url: "https://github.com/realbestia1/EasyProxy"
arch:
  - amd64
  - aarch64
  - armv7
init: false
ports:
  7860/tcp: 7860
ports_description:
  7860/tcp: "EasyProxy Web / API"
options:
  api_password: "cambia_questa_password"
  workers: 1
schema:
  api_password: str
  workers: int
map:
  - config:rw
